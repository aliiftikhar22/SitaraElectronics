<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sitara Electronics Admin</title>

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="admin-container">


<!-- LOGIN -->

<div id="loginBox">

<h1>Sitara Electronics</h1>
<h2>Admin Login</h2>

<input 
type="email" 
id="adminEmail" 
placeholder="Email">


<input 
type="password" 
id="adminPassword" 
placeholder="Password">


<button id="loginBtn">
Login
</button>


<p id="loginError"></p>

</div>



<!-- DASHBOARD -->

<div id="dashboard" style="display:none;">


<div class="top-bar">

<h1>Sitara Admin Panel</h1>


<button id="logoutBtn">
Logout
</button>


</div>



<!-- MENU -->

<div class="admin-menu">

<button id="ordersTab">
Orders
</button>


<button id="productsTab">
Products
</button>

</div>





<!-- ORDERS SECTION -->

<div id="ordersSection">


<h2>
Orders
</h2>


<div id="ordersContainer">

Loading orders...

</div>


</div>







<!-- PRODUCTS SECTION -->

<div id="productsSection" style="display:none;">


<h2>
Add Product
</h2>



<input 
id="productName"
placeholder="Product Name">



<select id="productCategory">

<option>Air Conditioners</option>
<option>Refrigerators</option>
<option>Microwave Ovens</option>
<option>Ovens</option>
<option>Heaters</option>
<option>Irons</option>
<option>Washing Machines</option>
<option>LED TVs</option>
<option>Fans</option>
<option>Other Appliances</option>

</select>




<input 
id="productBrand"
placeholder="Brand">





<input 
id="productPrice"
type="number"
placeholder="Price">





<input 
id="productStock"
type="number"
placeholder="Stock Quantity">





<input 
id="productImage"
placeholder="Image URL">





<button id="addProductBtn">

Add Product

</button>




<h2>
Products
</h2>


<div id="productsContainer">

</div>


</div>



</div>


</div>



<script type="module" src="js/admin.js"></script>


</body>
</html>
